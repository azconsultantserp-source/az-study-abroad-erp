# Tuned for a 2–4 GB Hostinger VPS running app + Postgres on the same machine.
# Adjust shared_buffers upward if you upgrade RAM.

listen_addresses = '*'
port = 5432
max_connections = 50

shared_buffers = 256MB
effective_cache_size = 768MB
maintenance_work_mem = 64MB
work_mem = 8MB
wal_buffers = 8MB

checkpoint_completion_target = 0.9
random_page_cost = 1.1

log_timezone = 'UTC'
timezone = 'UTC'
