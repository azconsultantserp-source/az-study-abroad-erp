user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Structured access logs for observability.
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                  'urt="$upstream_response_time"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;

  # Allow 10MB document uploads (matches app limit).
  client_max_body_size 12m;

  # Gzip compression for text assets.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain text/css text/javascript application/javascript
    application/json application/xml image/svg+xml font/woff2;

  # Rate limit zones: general API and stricter auth/login.
  limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
  limit_conn_zone $binary_remote_addr zone=conns:10m;

  upstream nextjs_app {
    server app:3000;
    keepalive 32;
  }

  include /etc/nginx/conf.d/*.conf;
}
