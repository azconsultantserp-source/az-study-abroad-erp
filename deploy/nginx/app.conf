# Replace erp.azconsultants.com with your real domain before deploying.

# --- HTTP: ACME challenge + redirect to HTTPS ---------------------------
server {
  listen 80;
  listen [::]:80;
  server_name erp.azconsultants.com;

  # Let's Encrypt HTTP-01 challenge.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# --- HTTPS: main app ----------------------------------------------------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name erp.azconsultants.com;

  ssl_certificate /etc/letsencrypt/live/erp.azconsultants.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/erp.azconsultants.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # HSTS (app also sets this, but enforce at the edge too).
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  limit_conn conns 20;

  # Login/auth endpoints: strict brute-force protection at the edge.
  location /api/auth/ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://nextjs_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Health check: no rate limit, no logging noise.
  location = /api/health {
    access_log off;
    proxy_pass http://nextjs_app;
    proxy_set_header Host $host;
  }

  # Long-cache immutable Next.js static assets.
  location /_next/static/ {
    proxy_pass http://nextjs_app;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Everything else.
  location / {
    limit_req zone=general burst=60 nodelay;
    proxy_pass http://nextjs_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
