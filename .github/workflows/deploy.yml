name: Deploy to VPS

# Deploys to the Hostinger VPS over SSH after CI passes on main.
# Required repository secrets:
#   VPS_HOST        - server IP or hostname
#   VPS_USER        - SSH user (e.g. deploy)
#   VPS_SSH_KEY     - private key with access to the server
#   VPS_APP_DIR     - absolute path of the app on the server (e.g. /opt/az-erp)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"
            git pull --ff-only
            docker compose --profile deploy up -d --build
            docker compose --profile backup up -d
            docker image prune -f
            sleep 8
            docker compose exec -T app node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
