# Production stack for a single Hostinger VPS (app + PostgreSQL + Nginx).
#
#   docker compose --profile deploy up -d --build
#
# Services:
#   postgres - PostgreSQL 16 (internal Docker network only — NOT exposed to internet)
#   migrate  - one-shot Prisma schema apply, then exits
#   app      - Next.js standalone server (internal :3000)
#   nginx    - TLS termination, rate limiting (public :80/:443)
#   backup   - nightly pg_dump + uploads archive

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-azc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-az_erp}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-azc} -d ${POSTGRES_DB:-az_erp}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    profiles: ["deploy", "backup"]

  migrate:
    build:
      context: .
      target: builder
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-azc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-az_erp}?schema=public}
    command: sh -c "npx prisma migrate deploy || npx prisma db push --accept-data-loss=false"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["deploy", "migrate"]

  app:
    build:
      context: .
      target: runner
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-azc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-az_erp}?schema=public}
    expose:
      - "3000"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 768M
    profiles: ["deploy"]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["deploy"]

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    profiles: ["certbot"]

  backup:
    image: postgres:16-alpine
    env_file: .env
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-azc}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-az_erp}
    volumes:
      - uploads:/data/uploads:ro
      - ./backups:/backups
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
      - ./deploy/backup-crontab:/etc/crontabs/root:ro
    entrypoint: ["sh", "-c", "chmod +x /usr/local/bin/backup.sh && crond -f -l 8"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["deploy", "backup"]

volumes:
  uploads:
  pgdata:
